[package]
name = "linox-boot"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
verification-boot = ["linox-kernel/verification-boot"]
linux-boot-profile = ["linox-kernel/linux-boot-profile"]

[[bin]]
name = "linox-boot"
path = "src/main.rs"

[dependencies]
linox-kernel = { path = "../../kernel" }
