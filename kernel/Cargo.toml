[package]
name = "linox-kernel"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
verification-boot = []
linux-boot-profile = []

[lib]
path = "src/lib.rs"

[dependencies]
linox-credentials = { path = "../crates/credentials" }
linox-keyrings = { path = "../crates/keyrings" }
linox-landlock = { path = "../crates/landlock" }
linox-rtnetlink = { path = "../crates/rtnetlink" }
linox-udplite = { path = "../crates/udplite" }
linox-tun = { path = "../crates/tun" }
linox-ktls = { path = "../crates/ktls" }
linox-tty = { path = "../crates/tty" }
linox-image-store = { path = "../crates/image-store" }
linox-memory-areas = { path = "../crates/memory-areas" }
linox-initial-stack = { path = "../crates/initial-stack" }
linox-deadline-heap = { path = "../crates/deadline-heap" }
linox-slab = { path = "../crates/slab" }
linox-cgroup = { path = "../crates/cgroup" }
linox-ext2 = { path = "../crates/ext2" }
linox-seccomp = { path = "../crates/seccomp" }
linox-kernel-policy = { path = "../crates/kernel-policy" }
linox-oci = { path = "../crates/oci" }
linox-oci-cache = { path = "../crates/oci-cache" }
ed25519-dalek = { version = "=3.0.0", default-features = false }
font8x8 = { version = "=0.3.1", default-features = false }
linox-native-abi = { path = "../crates/native-abi" }
linox-usb-audio = { path = "../crates/usb-audio" }
linox-usb-hid = { path = "../crates/usb-hid" }
linox-virtio-gpu = { path = "../crates/virtio-gpu" }
linox-drm = { path = "../crates/drm" }
linox-volume-format = { path = "../crates/volume-format" }
linox-volume-service = { path = "../crates/volume-service" }
miniz_oxide = { version = "=0.9.1", default-features = false }
smoltcp = { version = "=0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-udp", "socket-tcp", "socket-raw", "auto-icmp-echo-reply", "iface-max-addr-count-8"] }

[lints.rust]
# Set for the kernel's target in .cargo/config.toml (kernel TLS's ciphers).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(aes_force_soft)", "cfg(polyval_force_soft)"] }
