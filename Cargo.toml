[workspace]
members = [
    "boot/efi",
    "control-plane/runtime",
    "crates/command",
    "crates/credentials",
    "crates/deadline-heap",
    "crates/drm",
    "crates/ext2",
    "crates/image-store",
    "crates/keyrings",
    "crates/ktls",
    "crates/landlock",
    "crates/memory-areas",
    "crates/cgroup",
    "crates/kernel-policy",
    "crates/native-abi",
    "crates/oci",
    "crates/oci-cache",
    "crates/protocol-state",
    "crates/rtnetlink",
    "crates/runtime-memory",
    "crates/seccomp",
    "crates/slab",
    "crates/tty",
    "crates/tun",
    "crates/udplite",
    "crates/usb-audio",
    "crates/usb-hid",
    "crates/virtio-gpu",
    "crates/volume-format",
    "crates/volume-service",
    "kernel",
    "services/network",
    "services/protocol",
    "services/volume",
    "tools/manifest-tool",
]
# Linux programs for domains, with their own workspace and crates.io
# dependencies; see userland/Cargo.toml.
exclude = ["userland"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true

[profile.release.package.ginux-controller-runtime]
opt-level = "z"
